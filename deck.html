<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View-X</title>
  <link rel="stylesheet" href="icons/RemixIcon_Font/remixicon.css">
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <div class="workspace-shell">
    <aside class="workspace-bar" aria-label="Workspace actions">
      <div class="workspace-brand" aria-label="View-X">
        <img src="View X logo.svg" alt="">
      </div>
      <nav id="column-nav" class="column-nav" aria-label="Columns"></nav>
      <button id="add-column-trigger" class="workspace-rail-button" type="button" aria-label="Add column" aria-expanded="false" aria-controls="add-column-form">
        <i class="ri-add-line" aria-hidden="true"></i>
      </button>
      <button id="layout-columns-button" class="workspace-rail-button" type="button" aria-label="Show all columns at once" aria-pressed="false">
        <i class="ri-layout-vertical-line" aria-hidden="true"></i>
      </button>
      <div class="workspace-column-actions" aria-label="Current column actions">
        <button id="expand-column-button" class="workspace-rail-button" type="button" aria-label="Expand current column">
          <i class="ri-fullscreen-line" aria-hidden="true"></i>
        </button>
        <button id="refresh-column-button" class="workspace-rail-button" type="button" aria-label="Refresh current column">
          <i class="ri-refresh-line" aria-hidden="true"></i>
        </button>
        <button id="close-column-button" class="workspace-rail-button workspace-close-button" type="button" aria-label="Close current column">
          <i class="ri-close-circle-line" aria-hidden="true"></i>
        </button>
      </div>
      <div class="workspace-preferences" aria-label="Workspace preferences">
        <button id="hide-ads-button" class="workspace-rail-button" type="button" aria-label="Hide promoted posts" aria-pressed="false">
          <i class="ri-advertisement-line" aria-hidden="true"></i>
        </button>
        <button id="hide-column-header-button" class="workspace-rail-button" type="button" aria-label="Hide X app headers" aria-pressed="false">
          <i class="ri-layout-row-fill" aria-hidden="true"></i>
        </button>
        <button id="appearance-button" class="workspace-rail-button" type="button" aria-label="Toggle appearance" aria-pressed="false">
          <i id="appearance-icon" class="ri-moon-line" aria-hidden="true"></i>
        </button>
      </div>
      <a id="x-settings-link" class="workspace-avatar" href="https://x.com/settings" target="_blank" rel="noopener" aria-label="Open X settings">
        <img id="x-avatar-image" alt="" hidden>
        <span id="x-avatar-fallback" aria-hidden="true"><i class="ri-twitter-x-line"></i></span>
      </a>
      <div id="settings-panel" class="settings-panel" role="group" aria-label="Accent color" hidden>
        <button class="accent-swatch" type="button" data-accent="blue" aria-label="Blue accent" aria-pressed="false"></button>
        <button class="accent-swatch" type="button" data-accent="lavender" aria-label="Lavender accent" aria-pressed="false"></button>
        <button class="accent-swatch" type="button" data-accent="light" aria-label="Light accent" aria-pressed="true"></button>
      </div>
      <button id="settings-button" class="workspace-settings" type="button" aria-label="Accent color settings" aria-expanded="false" aria-controls="settings-panel">
        <i class="ri-settings-line" aria-hidden="true"></i>
      </button>
    </aside>

    <main id="columns-container" aria-label="X columns">
      <section id="empty-state" class="empty-state" aria-live="polite">
        <p class="empty-eyebrow">PERSONAL BROWSER WORKSPACE</p>
        <h1>Start with one X URL.</h1>
        <p>Add Home, a list, search, profile, or any X page. Columns stay where you put them.</p>
      </section>
      <form id="add-column-form" class="workspace-add-card" novalidate hidden>
        <div class="add-card-input">
          <label class="sr-only" for="column-url">X URL</label>
          <input id="column-url" name="column-url" type="text" inputmode="url" autocomplete="off"
            spellcheck="false" placeholder="https://x.com/home">
          <button class="add-column-button" type="submit"><i class="ri-add-line" aria-hidden="true"></i><span>Add Column</span></button>
          <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
        </div>
        <img class="add-card-brand" src="View X logo.svg" alt="">
      </form>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="workspace-storage.js"></script>
  <script src="x-adapter.js"></script>
  <script src="column.js"></script>
  <script type="module" src="deck.js"></script>
</body>
</html>
